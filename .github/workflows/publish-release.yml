name: Build packages and publish new versions

on:
  push:
    branches: ['**']
  workflow_dispatch:

# Build every branch push, including documentation-only changes. Do not cancel
# older builds when another commit arrives. Publishing alone needs write access.
permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: '3'

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate packaging and release rules
        run: python -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Read package version
        id: version
        run: echo "version=$(python scripts/ci/version.py)" >> "$GITHUB_OUTPUT"

  apple:
    needs: metadata
    name: Build ${{ matrix.platform }} arm64
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: [macOS, iOS]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          python -m pip install 'cmake==4.4.4' 'ninja==1.13.2'
          brew list nasm >/dev/null 2>&1 || brew install nasm
          command -v pwsh >/dev/null || brew install --cask powershell
          test "$(uname -m)" = arm64
          xcodebuild -version
      - name: Prepare pinned Axmol engine
        run: bash scripts/prepare-engine.sh
      - name: Install pinned shader compiler
        run: python scripts/ci/setup_axslcc.py
      - name: Build and package macOS
        if: matrix.platform == 'macOS'
        run: |
          bash scripts/build-macos.sh
          mkdir -p dist/packages
          bash scripts/package-desktop.sh macos \
            'build/macos-release/bin/RoomBreakEscapeNow/RoomBreak Escape Now.app' \
            dist/packages/RoomBreak-macOS-arm64.pkg
      - name: Build and package unsigned iOS
        if: matrix.platform == 'iOS'
        run: |
          bash scripts/build-ios.sh device
          mkdir -p dist/packages dist/ios/Payload
          ditto 'build/ios-device/bin/RoomBreakEscapeNow/Release/RoomBreak Escape Now.app' \
            'dist/ios/Payload/RoomBreak Escape Now.app'
          cd dist/ios
          ditto -c -k --keepParent Payload ../packages/RoomBreak-iOS-arm64-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: dist/packages/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  windows:
    needs: metadata
    name: Build Windows amd64
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install build tools
        run: |
          python -m pip install 'cmake==4.4.4' 'ninja==1.13.2'
          if ($LASTEXITCODE) { throw 'Build tool installation failed' }
          choco install nasm nsis --no-progress -y
          if ($LASTEXITCODE) { throw 'NSIS/NASM installation failed' }
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Prepare pinned Axmol engine
        run: ./scripts/prepare-engine.ps1
      - name: Install pinned shader compiler
        run: python scripts/ci/setup_axslcc.py
      - name: Build Windows
        run: ./scripts/build-windows.ps1
      - name: Package Windows with the Visual C++ runtime
        run: |
          New-Item -ItemType Directory -Force dist/packages | Out-Null
          Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile dist/vc_redist.x64.exe
          $signature = Get-AuthenticodeSignature dist/vc_redist.x64.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw 'The Visual C++ runtime signature is invalid'
          }
          $version = python scripts/ci/version.py
          $payload = (Resolve-Path 'build/windows-release/bin/RoomBreakEscapeNow').Path
          if (-not (Test-Path "$payload/RoomBreak Escape Now.exe")) { throw 'Missing game executable' }
          if (Get-ChildItem $payload -Recurse -File | Where-Object { $_.Name -like 'roombreak-rebuilt-progress*' -or $_.Name -like 'UserDefault.*' }) {
            throw 'Refusing to package user saves'
          }
          $redist = (Resolve-Path dist/vc_redist.x64.exe).Path
          $output = Join-Path $pwd 'dist/packages/RoomBreak-Windows-amd64.exe'
          makensis /WX "/DAPP_VERSION=$version" "/DPACKAGE_DIR=$payload" "/DVC_REDIST=$redist" "/DOUTPUT_FILE=$output" scripts/windows-installer.nsi
          if ($LASTEXITCODE) { throw 'Windows packaging failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: package-Windows
          path: dist/packages/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  android:
    needs: metadata
    name: Build Android arm64
    env:
      RB_ANDROID_KEYSTORE: ${{ github.workspace }}/../roombreak-ci.keystore
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install build tools and Android SDK
        run: |
          python -m pip install 'cmake==4.4.4' 'ninja==1.13.2'
          sudo apt-get update
          sudo apt-get install -y nasm
          command -v pwsh
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;30.0.16248370'
      - name: Prepare pinned Axmol engine
        run: bash scripts/prepare-engine.sh
      - name: Install pinned shader compiler
        run: python scripts/ci/setup_axslcc.py
      - name: Restore stable Android signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64" || { echo 'Missing Android signing secret'; exit 1; }
          umask 077
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RB_ANDROID_KEYSTORE"
          chmod 600 "$RB_ANDROID_KEYSTORE"
          keytool -exportcert -alias androiddebugkey -keystore "$RB_ANDROID_KEYSTORE" \
            -storetype PKCS12 -storepass android -file "$RUNNER_TEMP/roombreak-signing.der"
          python - "$RUNNER_TEMP/roombreak-signing.der" <<'PY'
          import hashlib, pathlib, sys
          actual = hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest()
          expected = pathlib.Path('scripts/ci/android-signing-certificate.sha256').read_text().strip()
          if actual != expected:
              raise SystemExit('The Android secret does not match the configured certificate')
          print('Android keystore certificate matches the pinned fingerprint')
          PY
      - name: Build and package Android
        run: |
          bash scripts/build-android.sh
          mkdir -p dist/packages
          cp 'dist/android/RoomBreak Escape Now.apk' dist/packages/RoomBreak-Android-arm64-v8a.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs \
            dist/packages/RoomBreak-Android-arm64-v8a.apk > "$RUNNER_TEMP/apk-signature.txt"
          cat "$RUNNER_TEMP/apk-signature.txt"
          expected=$(cat scripts/ci/android-signing-certificate.sha256)
          grep -Fx "Signer #1 certificate SHA-256 digest: $expected" "$RUNNER_TEMP/apk-signature.txt"
      - name: Remove signing key
        if: always()
        run: rm -f "$RB_ANDROID_KEYSTORE" "$RUNNER_TEMP/roombreak-signing.der"
      - uses: actions/upload-artifact@v4
        with:
          name: package-Android
          path: dist/packages/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  bundle:
    needs: [metadata, apple, windows, android]
    name: Collect all six release files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist/release
      - name: Generate installation instructions and checksums
        run: python scripts/ci/packages.py dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: RoomBreak-v${{ needs.metadata.outputs.version }}-${{ github.sha }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    needs: [metadata, bundle]
    name: Publish only a new version
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: roombreak-publish
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: RoomBreak-v${{ needs.metadata.outputs.version }}-${{ github.sha }}
          path: dist/release
      - name: Publish verified installers with the commit message
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/ci/release.py
